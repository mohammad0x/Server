{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Custom Item</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style type="text/tailwindcss">
            @layer utilities {
                .content-auto {
                    content-visibility: auto;
                }
            }
        </style>
    </head>
    <body style="width: 100vw; height: 100vh;" dir="ltr">
        <section class="w-full h-full flex items-center justify-center bg-gray-400">
            <div class="md:w-5/12 h-1/3 shadow-lg rounded bg-white p-4">
                <div class="text-center text-3xl font-bold">
                    Update or Create Custom Item
                </div>
                <form method="POST" class="flex flex-col items-center w-full h-full pt-6">
                    {% csrf_token %}

                    <label for="system_id" class="text-xl mb-3">System id:</label>
                    <input type="number" name="system_id" id="system_id" class="w-3/4 h-8 p-1 border border-black rounded">

                    <input type="submit" value="Submit" class="w-36 h-12 border border-black rounded mt-6 hover:shadow-2xl">
                </form>
            </div>
        </section>
    </body>
    <script src="https://cdn.tailwindcss.com"></script>
</html>
